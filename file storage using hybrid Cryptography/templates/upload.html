{% extends "base.html" %}

{% block title %}PhantomFiles · Upload{% endblock %}

{% block content %}
<form class="panel" action="/data" method="POST" enctype="multipart/form-data">
  <label class="label" for="upload-file">Select a file to encrypt</label>
  <input id="upload-file" class="file-input" type="file" name="file" required />
  <button class="btn btn-primary" type="submit">Start Encryption</button>
</form>
<a class="text-link" href="{{ url_for('index') }}">← Back to Home</a>
{% endblock %}
