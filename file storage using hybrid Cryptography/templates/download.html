{% extends "base.html" %}

{% block title %}PhantomFiles · Restore{% endblock %}

{% block content %}
<form class="panel" action="/download_data" method="POST" enctype="multipart/form-data">
  <label class="label" for="key-file">Upload your .pem key file</label>
  <input id="key-file" class="file-input" type="file" name="file" required />
  <button class="btn btn-primary" type="submit">Start Decryption</button>
</form>
<a class="text-link" href="{{ url_for('index') }}">← Back to Home</a>
{% endblock %}
